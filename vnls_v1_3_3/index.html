<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VNLS – Virtual Neuron Learning System</title>
<style>
  :root{--bg:#0a0a0a;--panel:#141414f2;--line:#333;--fg:#ececec;--dim:#8a8a8a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #panel{position:fixed;left:12px;top:12px;width:300px;min-width:220px;max-width:92vw;max-height:calc(100% - 24px);overflow:auto;resize:both;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-sizing:border-box}
  #phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#1b1b1b;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none}
  #phead .t{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#fff;font-weight:600}
  #pcol{width:26px;height:26px;margin:0;padding:0;line-height:1;cursor:pointer}
  #pbody{padding:4px 12px 12px}#panel.collapsed #pbody{display:none}#panel.collapsed{resize:none;height:auto!important}
  details{border-bottom:1px solid #262626;padding:6px 0}details:last-child{border-bottom:0}
  summary{cursor:pointer;color:#ddd;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 0;user-select:none}
  canvas.s{border:1px solid var(--line);display:block;margin:6px 0 2px;image-rendering:pixelated;background:#000}
  #retina,#pad,#wr{width:100%;height:auto;aspect-ratio:1}#pad{touch-action:none;cursor:crosshair}
  .two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
  .cap{color:var(--dim);font-size:11px;margin-bottom:6px}
  .row{display:flex;justify-content:space-between;margin:2px 0}.row b{font-variant-numeric:tabular-nums}
  .ok{color:#fff;font-weight:700}.bad{color:#8a8a8a;text-decoration:line-through}
  button{width:100%;margin-top:6px;padding:6px;background:#1c1c1c;color:var(--fg);border:1px solid var(--line);border-radius:6px;cursor:pointer;font:inherit}
  select{width:100%;background:#1c1c1c;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px;font:inherit}
  button:hover{border-color:#fff}#msg,#snote{color:#ccc;font-size:12px;min-height:16px;margin-top:6px}
  .sgrp{margin:10px 0 2px;color:#bbb;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .srow{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center;margin:3px 0}.srow label{grid-column:1/3;font-size:12px;color:#ccc}
  .srow input{width:100%;margin:0;accent-color:#ddd}.srow span{font-size:12px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  #gpuerr{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);max-width:min(560px,90vw);padding:16px 20px;background:#141414;border:1px solid #555;border-radius:10px;z-index:5;line-height:1.5}
  #gpuerr[hidden]{display:none}
  #hint{position:fixed;bottom:10px;right:14px;color:var(--dim);font-size:12px;text-align:right}
</style></head><body>
<canvas id="scene"></canvas>
<div id="gpuerr" hidden></div>
<div id="panel">
  <div id="phead"><span class="t" title="Virtual Neuron Learning System · Sanal Nöron Öğrenme Sistemi">VNLS <span id="ver"></span></span><button id="pcol" data-i18n-title="collapse">–</button></div>
  <div id="pbody">
    <div class="cap" data-i18n="full" style="margin:6px 0 2px"></div>
    <details open data-k="gor"><summary data-i18n="sec_images"></summary>
      <canvas id="retina" class="s" width="128" height="128"></canvas><div class="cap" data-i18n="cap_retina"></div>
      <div class="two">
        <div><canvas id="pad" class="s" width="256" height="256"></canvas><div class="cap" data-i18n="cap_pad"></div></div>
        <div><canvas id="wr" class="s" width="128" height="128"></canvas><div class="cap" data-i18n="cap_wr"></div></div>
      </div>
    </details>
    <details open data-k="dur"><summary data-i18n="sec_status"></summary>
      <div id="sel" class="cap" style="min-height:48px;color:#bbb"></div>
      <div class="row"><span data-i18n="r_shown"></span><b id="shown">–</b></div>
      <div class="row"><span data-i18n="r_ans"></span><b id="ans">–</b></div>
      <div class="row"><span data-i18n="r_sr"></span><b id="sr">–</b></div>
      <div class="row"><span data-i18n="r_gaze"></span><b id="gaze">0, 0 px</b></div>
      <div class="row"><span data-i18n="r_n"></span><b id="n">0</b></div>
      <div class="row"><span data-i18n="r_acc"></span><b id="acc">–</b></div>
    </details>
    <details open data-k="kon"><summary data-i18n="sec_controls"></summary>
      <button id="pause" data-i18n="b_pause"></button><button id="mode" data-i18n="b_mode_auto"></button><button id="speed" data-i18n="b_speed_0"></button><button id="teach" data-i18n="b_teach_on"></button>
      <button id="fonts" data-i18n="b_fonts_off"></button><button id="clr" data-i18n="b_clear"></button><button id="reset" data-i18n="b_reset"></button><div id="msg"></div>
    </details>
    <details data-k="ayr"><summary data-i18n="sec_settings"></summary>
      <div class="srow" style="margin-bottom:8px"><label for="lang" data-i18n="lang_label"></label><select id="lang"><option value="tr">Türkçe</option><option value="en">English</option></select></div>
      <div id="settings"></div><div id="snote"></div>
      <button id="sreload" data-i18n="b_sreload"></button><button id="sdef" data-i18n="b_sdef"></button>
    </details>
  </div>
</div>
<div id="hint"><div data-i18n="hint1"></div><div data-i18n="hint2"></div></div>
<script src="src/config.js"></script><script src="src/i18n.js"></script><script src="src/brain.js"></script>
<script src="src/world.js"></script><script src="src/retina.js"></script><script src="src/ui.js"></script><script src="src/main.js"></script>
</body></html>
